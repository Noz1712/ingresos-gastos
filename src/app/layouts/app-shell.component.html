<div class="app-shell">
  @if (mobileSidebarOpen()) {
    <button type="button" class="sidebar-overlay" (click)="closeMobileSidebar()" aria-label="Cerrar menu"></button>
  }

  <aside class="sidebar" [class.mobile-open]="mobileSidebarOpen()">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <img src="branding/logo-96.png" alt="" />
      </div>
      <div>
        <strong>Ingresos y Gastos</strong>
        <p>Finanzas personales</p>
      </div>
    </div>

    <nav class="nav">
      <a routerLink="/dashboard" routerLinkActive="active" (click)="closeMobileSidebar()">Dashboard</a>
      <a routerLink="/movimientos" routerLinkActive="active" (click)="closeMobileSidebar()">Movimientos</a>
      <a routerLink="/perfil" routerLinkActive="active" (click)="closeMobileSidebar()">Perfil</a>
      <details class="nav-group" open>
        <summary>Catalogo</summary>
        <a routerLink="/catalogo-gastos" routerLinkActive="active" (click)="closeMobileSidebar()">Catalogo de gasto</a>
        <a routerLink="/catalogo-ingresos" routerLinkActive="active" (click)="closeMobileSidebar()">Catalogo de ingreso</a>
        <a routerLink="/categorias-gastos" routerLinkActive="active" (click)="closeMobileSidebar()">Categoria gasto</a>
        <a routerLink="/categorias-ingresos" routerLinkActive="active" (click)="closeMobileSidebar()">Categoria ingreso</a>
      </details>
    </nav>

    @if (user$ | async; as user) {
      <section class="user-card">
        <img [src]="user.photoURL || 'https://placehold.co/96x96/e2efff/6c8fbd?text=IG'" [alt]="user.displayName || 'Usuario'" />
        <div>
          <strong>{{ user.displayName || 'Usuario' }}</strong>
          <p>{{ user.email }}</p>
        </div>
      </section>
    }

    <button type="button" class="logout-button" (click)="logout()">Cerrar sesion</button>
  </aside>

  <main class="content">
    <button type="button" class="mobile-menu-button" (click)="toggleMobileSidebar()" aria-label="Abrir menu">
      Menu
    </button>
    <router-outlet />
  </main>

  <nav class="mobile-tabbar" aria-label="Navegacion principal movil">
    <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
    <a routerLink="/movimientos" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Movimientos</a>
    <a routerLink="/perfil" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Perfil</a>
    <button type="button" class="tabbar-menu-button" (click)="toggleMobileSidebar()">Menu</button>
  </nav>
</div>

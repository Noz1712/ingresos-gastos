<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <img src="branding/logo-96.png" alt="" />
      </div>
      <div>
        <strong>Ingresos y Gastos</strong>
        <p>Finanzas personales</p>
      </div>
    </div>

    <nav class="nav">
      <a routerLink="/movimientos" routerLinkActive="active">Movimientos</a>
      <a routerLink="/perfil" routerLinkActive="active">Perfil</a>
      <details class="nav-group" open>
        <summary>Catalogo</summary>
        <a routerLink="/catalogo-gastos" routerLinkActive="active">Catalogo de gasto</a>
        <a routerLink="/catalogo-ingresos" routerLinkActive="active">Catalogo de ingreso</a>
        <a routerLink="/categorias-gastos" routerLinkActive="active">Categoria gasto</a>
        <a routerLink="/categorias-ingresos" routerLinkActive="active">Categoria ingreso</a>
      </details>
    </nav>

    @if (user$ | async; as user) {
      <section class="user-card">
        <img [src]="user.photoURL || 'https://placehold.co/96x96/e2efff/6c8fbd?text=IG'" [alt]="user.displayName || 'Usuario'" />
        <div>
          <strong>{{ user.displayName || 'Usuario' }}</strong>
          <p>{{ user.email }}</p>
        </div>
      </section>
    }

    <button type="button" class="logout-button" (click)="logout()">Cerrar sesion</button>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
